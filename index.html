<style>
/* Layout: persistent navy rail + light analytical workspace; dense terminal-grade tables, charts on quiet panels */
:root{
  --rail:#0c1626; --rail-2:#13213a; --rail-ink:#c9d3e3; --rail-mute:#7d8ba3; --rail-hi:#ffffff;
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f6f8fb; --line:#dfe4ec; --line-2:#c9d1dd;
  --ink:#0d1726; --ink-2:#435069; --mute:#7c879a;
  --accent:#1d4f91; --accent-soft:#e3ecf8; --accent-ink:#173f74;
  --up:#b4232a; --up-soft:#fbe9ea; --down:#1c5cab; --down-soft:#e5eefa; --flat:#6b7385;
  --warn:#9a6200; --warn-soft:#fdf2dc; --ok:#1e7a3c; --ok-soft:#e4f4e9; --crit:#b4232a;
  --c-coffee:#eb6834; --c-tea:#1baf7a; --c-hot:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --fc:#8a6fd1;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --rail:#070d18; --rail-2:#0f1a2d; --bg:#0b111b; --panel:#121a27; --panel-2:#172133; --line:#233047; --line-2:#2f3e58;
  --ink:#e5eaf2; --ink-2:#a9b4c7; --mute:#7a869b; --accent:#6ea0e6; --accent-soft:#1a2b45; --accent-ink:#a9c6ef;
  --up:#ef6b6b; --up-soft:#3a1a1e; --down:#5c9ae8; --down-soft:#15263f; --flat:#8d95a6;
  --warn:#e3a43a; --warn-soft:#33270f; --ok:#4cc276; --ok-soft:#12301d; --crit:#ef6b6b;
  --c-coffee:#d95926; --c-tea:#199e70; --c-hot:#3987e5; --fc:#a593e8; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; color-scheme:dark}}
:root[data-theme="dark"]{
  --rail:#070d18; --rail-2:#0f1a2d; --bg:#0b111b; --panel:#121a27; --panel-2:#172133; --line:#233047; --line-2:#2f3e58;
  --ink:#e5eaf2; --ink-2:#a9b4c7; --mute:#7a869b; --accent:#6ea0e6; --accent-soft:#1a2b45; --accent-ink:#a9c6ef;
  --up:#ef6b6b; --up-soft:#3a1a1e; --down:#5c9ae8; --down-soft:#15263f; --flat:#8d95a6;
  --warn:#e3a43a; --warn-soft:#33270f; --ok:#4cc276; --ok-soft:#12301d; --crit:#ef6b6b;
  --c-coffee:#d95926; --c-tea:#199e70; --c-hot:#3987e5; --fc:#a593e8; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--rail)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:28px;height:28px;border-radius:5px;background:linear-gradient(135deg,#2a5fa8,#163a6b);display:grid;place-items:center;flex:none}
.brand-mark svg{display:block}
.brand b{color:var(--rail-hi);font-size:15px;letter-spacing:.01em;font-weight:600}
.brand small{display:block;color:var(--rail-mute);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.nav{padding:4px 10px 12px;display:flex;flex-direction:column;gap:1px}
.nav h6{margin:14px 10px 6px;font:600 10px/1 var(--f-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--rail-mute)}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;color:var(--rail-ink);text-decoration:none;font-size:13px}
.nav a:hover{background:var(--rail-2);color:var(--rail-hi)}
.nav a.on{background:#1d3357;color:var(--rail-hi)}
.nav a.sub{padding-left:32px;font-size:12.5px}
.nav a .ph{margin-left:auto;font:500 9.5px/1 var(--f-mono);color:var(--rail-mute);border:1px solid #2a3a57;border-radius:3px;padding:2px 4px}
.nav a .cnt{margin-left:auto;font:600 10px/1 var(--f-mono);background:#7a2228;color:#fff;border-radius:8px;padding:2px 6px}
.nav svg{width:15px;height:15px;flex:none;opacity:.85}
.rail-foot{margin-top:auto;padding:14px 18px 18px;border-top:1px solid #1b2a44;font-size:11px;color:var(--rail-mute)}
.rail-foot b{color:var(--rail-ink);font-weight:500}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.gbar{flex-basis:100%;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line);margin-top:2px}
.gf{display:flex;flex-direction:column;gap:3px;min-width:0}
.gf label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.gf select{max-width:190px;padding:5px 8px;font-size:12.5px}
.gf select.act{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.gsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ib{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:6px;padding:0;border-radius:50%;border:1px solid var(--line-2);background:var(--panel);color:var(--mute);font:italic 600 10px/1 Georgia,"Times New Roman",serif;text-transform:none;letter-spacing:0;cursor:help;vertical-align:1px;flex:none}
.ib:hover,.ib[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.kpi .k .ib{width:14px;height:14px;font-size:9.5px}
.tip{position:fixed;z-index:80;max-width:320px;background:var(--ink);color:var(--panel);border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.5;box-shadow:0 10px 28px rgba(5,12,25,.28)}
.tip b{display:block;font-size:12px;margin-bottom:3px}
.tip p{margin:0;opacity:.92}
.tip p b{display:inline;margin:0}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 8px;cursor:pointer}
.search{position:relative;flex:1 1 280px;max-width:460px;min-width:0}
.search input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:7px 10px 7px 32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--mute)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 10px var(--f-mono);color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:1px 5px;background:var(--panel)}
.sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,40,.18);max-height:360px;overflow:auto;z-index:40}
.sugg button{display:flex;width:100%;gap:10px;align-items:baseline;border:0;background:none;text-align:left;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sugg button:hover,.sugg button.hi{background:var(--accent-soft)}
.sugg small{color:var(--mute);margin-left:auto;font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.top-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
select.ctl,input.ctl{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 8px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.bell{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 8px;cursor:pointer;display:flex}
.bell i{position:absolute;top:-5px;right:-6px;background:var(--crit);color:#fff;font:600 9.5px/1 var(--f-mono);font-style:normal;border-radius:8px;padding:2px 5px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:11.5px}

.view{padding-block:18px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.ph-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.crumb{font-size:11px;color:var(--mute);letter-spacing:.04em;margin-bottom:3px}
.crumb a{color:var(--mute);text-decoration:none}.crumb a:hover{color:var(--accent)}
h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:13.5px;font-weight:600}
h3{margin:0;font-size:12px;font-weight:600}
.sub-t{color:var(--ink-2);font-size:12.5px;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 7px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.chip.obs{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.chip.fc{border-color:transparent;background:color-mix(in srgb,var(--fc) 16%,transparent);color:var(--fc)}
.chip.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip.crit{border-color:transparent;background:var(--up-soft);color:var(--crit)}
.chip.info{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-21{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,1.65fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.p-head .meta{font-size:11px;color:var(--mute)}
.p-body{padding:12px 14px;min-width:0}
.p-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mute);margin-top:auto}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--ink-2)}
.breadth{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:4px}
.breadth span{display:block}

/* tables */
.tw{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{position:sticky;top:0;background:var(--panel-2);text-align:left;font:600 10.5px/1.2 var(--f-cond);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding:8px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;user-select:none}
.t th.r,.t td.r{text-align:right}
.t th.s{cursor:pointer}.t th.s:hover{color:var(--accent)}
.t th .ar{opacity:.35;margin-left:3px}.t th.sorted .ar{opacity:1;color:var(--accent)}
.t td:last-child,.t th:last-child{padding-right:14px}
.t td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--accent-soft)}
.t tr.sel td{background:color-mix(in srgb,var(--fc) 10%,transparent)}
.av{width:20px;height:20px;border-radius:50%;vertical-align:middle;object-fit:cover}
.t tr.dim td{opacity:.5}
/* dashboards */
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.dgrid>.panel{min-width:0} .sz3{grid-column:span 3}.sz4{grid-column:span 4}.sz6{grid-column:span 6}.sz8{grid-column:span 8}.sz12{grid-column:span 12}
.dw .p-head{gap:8px} .dw .p-head h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw .p-head .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.dtools{display:flex;gap:4px;align-items:center;flex-shrink:0}
.ib-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:5px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12.5px;line-height:1}
.ib-btn:hover{border-color:var(--accent);color:var(--accent)} .ib-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dtools select.ctl{padding:3px 4px;height:26px}
.dchart{height:260px} .sz12 .dchart{height:300px}
.dkpi .p-head{padding-bottom:0;border-bottom:0} .dkpi .p-head h2{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.dk .v{font-size:24px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap} .dk .s{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.dlibs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.dlib{all:unset;cursor:pointer;border:1px dashed var(--line-2);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.dlib:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent)} .dlib:focus-visible{outline:2px solid var(--accent)}
.dlib b{font-size:12.5px} .dlib small{font-size:11px;color:var(--ink-2);line-height:1.35}
.dcfg{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;gap:10px}
.dcfg-f{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
td.hc{font-weight:600}
@media (max-width:1280px){.sz3{grid-column:span 6}.sz4,.sz6,.sz8{grid-column:span 12}}
@media (max-width:760px){.sz3{grid-column:span 12}}
/* reports */
.rcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rcard{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:3px;background:var(--panel)}
.rcard:hover{border-color:var(--accent)} .rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.rcard b{font-size:13px} .rcard .rfr{font-size:11.5px;color:var(--accent)} .rcard small{color:var(--ink-2);font-size:11.5px;line-height:1.4}
.rgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.rside{position:sticky;top:12px}
.rpaper-wrap{background:var(--panel-2);padding:18px;overflow-x:auto}
.rpaper{width:794px;margin:0 auto;background:#fff;color:#16202e;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 24px rgba(0,0,0,.06);padding:34px 40px;font-size:11.5px;line-height:1.5;color-scheme:light}
.rpaper .rep-block{background:#fff;padding:2px 0 10px}
.rpaper .rh{border-bottom:2px solid #16202e;margin-bottom:12px;padding-bottom:12px}
.rpaper .rh1{display:flex;justify-content:space-between;align-items:flex-start}
.rpaper .rlogo b{display:block;font-size:13px;letter-spacing:.02em} .rpaper .rlogo span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#6b7686}
.rpaper .rmeta{text-align:right;font-family:var(--f-mono);font-size:9.5px;color:#6b7686}
.rpaper h1{font-size:21px;margin:16px 0 2px;letter-spacing:-.01em;color:#16202e}
.rpaper .rsub{color:#45505f;font-size:12px}
.rpaper .rinfo{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:10px;color:#45505f}
.rpaper .rinfo b{color:#16202e;text-transform:uppercase;letter-spacing:.06em;font-size:9px;margin-right:3px}
.rpaper h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:#1f5fbf;border-bottom:1px solid #e3e7ee;padding-bottom:4px;margin:8px 0 8px}
.rpaper h4{font-size:11px;margin:10px 0 4px;color:#16202e}
.rpaper .ri{color:#45505f;margin:0 0 8px}
.rpaper ul{margin:0 0 6px;padding-left:16px} .rpaper li{margin:0 0 4px} .rpaper p{margin:0 0 7px}
.rpaper .rk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rpaper .rk div{border:1px solid #e3e7ee;border-radius:5px;padding:7px 9px;display:flex;flex-direction:column;gap:1px}
.rpaper .rk span{font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:#6b7686;font-weight:600}
.rpaper .rk b{font-size:16px;font-variant-numeric:tabular-nums} .rpaper .rk small{font-size:9.5px;color:#45505f}
.rpaper .rt{width:100%;border-collapse:collapse;font-size:10px;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.rpaper .rt th{text-align:left;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:#6b7686;border-bottom:1px solid #c9d0db;padding:4px 5px;font-weight:600}
.rpaper .rt td{border-bottom:1px solid #eef1f5;padding:3.5px 5px;vertical-align:top} .rpaper .rt .r{text-align:right;white-space:nowrap}
.rpaper .rc{height:210px;margin:4px 0}
.rpaper .rleg{display:flex;flex-wrap:wrap;gap:12px;font-size:9.5px;color:#45505f;margin-bottom:6px}
.rpaper .rleg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.rpaper .rup{color:#c0392b} .rpaper .rdn{color:#1e7f5c}
.rpaper .rpill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:9.5px;font-weight:600;background:#eef1f5;color:#16202e}

<script>
(function(){
'use strict';
/* ============================ DATA LAYER ============================ */
const RAW = window.MI_DATA;
const KG_PER = {kg:1, lbs:0.45359237, lb:0.45359237, MT:1000, t:1000, '60kgBags':60, '50kgBags':50, '100kg':100, oz:0.028349523125};
const SUB = {}; RAW.tax.forEach(([id,cat,sub,act])=>SUB[id]={id,cat,sub,act});
const CAT_ID = {}; RAW.cats.forEach((c,i)=>CAT_ID[i+1]=c);   // id_categorie -> name, by order in taxonomy list
const CTRY = RAW.ctry;
const PRIORITY = new Set(RAW.priority);
const CAT_ORDER = [...new Set(RAW.series.map(s=>s.cat))].sort((a,b)=>a-b);
const CATCOLOR = {}; CAT_ORDER.forEach((c,i)=>CATCOLOR[c]='--s'+(i+1));
const SUBCAT = {}; RAW.series.forEach(s=>SUBCAT[s.sub]=s.cat);
const SUBCOLOR = new Proxy({}, {get:(t,k)=>CATCOLOR[SUBCAT[k]]||'--accent'});     // dots take their category colour
const IMPORTS = (RAW.imports||[]).map(x=>Object.assign({report:null}, x));

let DATES = RAW.dates.slice();          // ISO strings, weekly calendar
function mkSeries(o){ const s=Object.assign({},o); delete s.v; delete s.obs; delete s.fc; delete s.est; Object.defineProperty(s,'v',{get(){ return V(this); },enumerable:false,configurable:true}); return s; }
const OBS_END = RAW.obs_end!=null? RAW.obs_end : RAW.fstart-1;   // last week with observed (source-file) prices
const EST = RAW.estimation||null;
const padTo=(a,n)=>a.concat(new Array(Math.max(0,n-a.length)).fill(null));
RAW.series.forEach(s=>{ if(s.o0){ s.obs=new Array(s.o0).fill(null).concat(s.obs); } delete s.o0; });
let SERIES = RAW.series.map(s=>{ const n=RAW.dates.length, pre=new Array(s.obs.length).fill(null);
  const ev=Array.isArray(s.est)? s.est : (s.est? s.est.v : []);
  return mkSeries(Object.assign({}, s, {name:s.name.replace(/\s+(EUR|USD)\/\S+$/,'').trim(), raw:padTo(s.obs.concat(ev),n), oe:s.obs.length-1,
    st:null, der:null, lo:null, hi:null,
    ufc:null, ufcStart:RAW.fstart, fsDate:null, src:s.src||'IMP-001', fcFactors: RAW.factors[s.sub]||null})); });
delete RAW.series;
function reindex(){
  SERIES.forEach(s=>{ s.fs = s.fsDate ? DATES.indexOf(s.fsDate) : DATES.length; if(s.fs<0) s.fs=DATES.length; });
  BYID = {}; SERIES.forEach(s=>BYID[s.id]=s);
  LAST_OBS = 0;
  SERIES.forEach(s=>{ for(let i=Math.min(s.fs,DATES.length)-1;i>=0;i--){ if(s.raw[i]!=null){ if(i>LAST_OBS) LAST_OBS=i; break; } } });
}
let BYID={}, LAST_OBS=0;
reindex();

/* ============================ STATE ============================ */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('mi.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('mi.'+k, JSON.stringify(v)); }catch(e){} }
};
const DEFAULT_WL = ['BVH00002','BVH00001','BVC00039','BVC00040','BVT00045','BVT00046','BVC00030','BVC00042'];
const S = {
  asOf: LAST_OBS, dm: 'all', cur: (v=>(v&&v!=='native')?v:'USD')(store.get('cur2','USD')), dunit: store.get('dunit','native'),
  g: Object.assign({cat:'',sub:'',ctry:'',unit:''}, store.get('g',{})),
  wl: new Set(store.get('wl', DEFAULT_WL)),
  route: 'overview',
  wk: {q:'',cur:'',type:'',ql:'',flat:false,wl:false,sort:'sub',dir:1,page:0,size:50},
  pcr: {metric:'wow',pct:5,z:2,n:10,diff:false,sub:''},
  prof: {range:'3Y'},
};
const charts = [];

/* ============================ UTILS ============================ */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css = n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dParts(iso){ const [y,m,d]=iso.split('-').map(Number); return {y,m,d}; }
function fmtD(iso){ if(!iso) return '—'; const p=dParts(iso); return p.d+' '+MON[p.m-1]+' '+p.y; }
function fmtDs(iso){ const p=dParts(iso); return p.d+' '+MON[p.m-1]+' '+String(p.y).slice(2); }
function isoWeek(iso){ const p=dParts(iso); const dt=new Date(Date.UTC(p.y,p.m-1,p.d)); const day=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-day+3); const fy=dt.getUTCFullYear(); const j4=new Date(Date.UTC(fy,0,4)); const w=1+Math.round(((dt-j4)/864e5-3+((j4.getUTCDay()+6)%7))/7); return {y:fy,w}; }
function wkLabel(iso){ const k=isoWeek(iso); return 'W'+String(k.w).padStart(2,'0')+' '+k.y; }
function median(a){ const b=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y); if(!b.length) return null; const m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; }
function mean(a){ const b=a.filter(x=>x!=null&&isFinite(x)); return b.length? b.reduce((s,x)=>s+x,0)/b.length : null; }
function sd(a){ const b=a.filter(x=>x!=null&&isFinite(x)); if(b.length<3) return null; const m=mean(b); return Math.sqrt(b.reduce((s,x)=>s+(x-m)*(x-m),0)/(b.length-1)); }
function fmtP(v){ if(v==null||!isFinite(v)) return '—'; const a=Math.abs(v); return v.toLocaleString('en-GB',{minimumFractionDigits: a>=100?0:a>=10?1:2, maximumFractionDigits: a>=100?0:a>=10?1:a>=1?2:3}); }
function fmtPct(x,dp=1){ if(x==null||!isFinite(x)) return '—'; const v=x*100; return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(dp)+'%'; }
function fmtAbs(x){ if(x==null||!isFinite(x)) return '—'; return (x>0?'+':x<0?'−':'')+fmtP(Math.abs(x)); }
function cls(x,eps=1e-6){ return x==null?'nm-v':x>eps?'up':x<-eps?'down':'flat'; }
function deltaHTML(x, opts={}){
  if(x==null||!isFinite(x)) return '<span class="nm-v" title="'+(opts.why||'Not available')+'">'+(opts.nm?'n.m.':'—')+'</span>';
  const c=cls(x), tri = c==='up'?'▲':c==='down'?'▼':'■';
  return '<span class="dl '+c+'"><span class="tri">'+tri+'</span>'+(opts.abs?fmtAbs(x):fmtPct(x,opts.dp??1))+'</span>';

/* ---------- Frankfurter API (ECB reference rates, CORS-enabled) ---------- */
const FRK='https://api.frankfurter.dev/v1/';
async function fxFrankfurter(from,to){
  const daily={}; const y0=+from.slice(0,4), y1=+to.slice(0,4);
  for(let y=y0;y<=y1;y++){ const a=y===y0?from:y+'-01-01', b=y===y1?to:y+'-12-31';
    const r=await fetch(FRK+a+'..'+b+'?base=EUR',{cache:'no-store'}); if(!r.ok) throw new Error('Frankfurter HTTP '+r.status);
    const j=await r.json(); const R=j.rates||{}; Object.entries(R).forEach(([d,q])=>{ const o={}; Object.entries(q).forEach(([c,v])=>{ if(typeof v==='number'&&v>0) o[c]=v; }); if(Object.keys(o).length) daily[d]=o; }); }
  const ds=Object.keys(daily).sort(); if(!ds.length) return null;
  return {daily, from:ds[0], to:ds[ds.length-1], currencies:[...new Set(ds.flatMap(d=>Object.keys(daily[d])))].sort(), file:'Frankfurter API (ECB reference rates)', format:'JSON · api.frankfurter.dev/v1 · base EUR'};
}
function fxNextFrom(full){ const last=FX.dates.length?FX.dates[FX.dates.length-1]:null; if(full||!last||FX.dates.length<200) return '2014-12-01'; const d=new Date(last+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); }
async function fxUpdateFrankfurter(full,quiet){
  const from=fxNextFrom(full), to=new Date().toISOString().slice(0,10);
  if(from>to){ if(!quiet) toast('FX rates already up to date'); return 'current'; }
  const res=await fxFrankfurter(from,to);
  if(!res){ if(!quiet) toast('No new ECB rates since '+fmtD(FX.dates[FX.dates.length-1])); return 'none'; }
  const canSave=allow('fx.manage');
  if(canSave){ FX.meta.source='ECB euro foreign exchange reference rates (via Frankfurter API)'; FX.meta.mode='api'; const where=await saveFXRates(res.daily,res); render(); if(!quiet) toast(where==='shared'?'FX updated from Frankfurter: '+Object.keys(res.daily).length+' days to '+fmtD(res.to):'FX applied for this session ('+where+')'); return where; }
  Object.entries(res.daily).forEach(([d,r])=>{ FX.daily[d]=Object.assign({},FX.daily[d]||{},r); }); rebuildFX(); render(); return 'session';
}
function fxAutoMaybe(){

}

async function saveFXRates(newDaily, info){ auditLog('fx.import', info.file, info.from+' → '+info.to+' · '+info.currencies.length+' currencies');
  Object.entries(newDaily).forEach(([d,r])=>{ FX.daily[d]=Object.assign({},FX.daily[d]||{},r); });

  FX.meta.lastImport=nowIso; FX.meta.lastDate=FX.dates.length? Object.keys(FX.daily).sort().pop() : info.to; FX.meta.log=[entry].concat(FX.meta.log||[]).slice(0,10);

}
function normDate(x){ if(x==null) return null; if(typeof x==='number') return serialToISO(x); x=String(x).trim().replace(/^"|"$/g,''); let m;

  if((m=x.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/))) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null; }
async function parseFXFile(file){

  } else {

    if(iD<0||iQ<0||iR<0) throw new Error('Columns not recognised. Use the ECB layout (Date, USD, GBP, …) or Date, Base, Quote, Rate.');

    const P=[]; rows.slice(1).forEach(r=>{ const d=normDate(r[iD]), q=(r[iQ]||'').toUpperCase(), b=iB>=0?((r[iB]||'EUR').toUpperCase()):'EUR', x=num(r[iR]); if(!d||!iso3(q)||!(x>0)){ skipped++; return; } P.push([d,b,q,x]); });

/* ============================ ANALYTICS ============================ */
// value lookups use observed data only (index < s.fs)
function lastObs(s, t){ for(let i=Math.min(t, s.fs-1); i>=0; i--) if(s.v[i]!=null) return i; return -1; }

const CACHE = new Map();
function stats(s, t=S.asOf){

  const r={s, L:-1};

  if(L<0){ CACHE.set(key,r); return r; }
  const v=s.v; r.latest=v[L]; r.date=DATES[L]; r.stale=t-L;
  let P=-1; for(let i=L-1;i>=L-4&&i>=0;i--) if(v[i]!=null){P=i;break;}
  r.P=P; r.prev=P>=0?v[P]:null; r.prevDate=P>=0?DATES[P]:null;
  r.abs = r.prev!=null? r.latest-r.prev : null;
  r.wow = pctCh(r.latest,r.prev,s);
  const M=refObs(s,L,4); r.mom = M>=0? pctCh(r.latest,v[M],s):null; r.momAbs = M>=0? r.latest-v[M]:null;
  const Y=refObs(s,L,52); r.yoy = Y>=0? pctCh(r.latest,v[Y],s):null; r.yoyAbs = Y>=0? r.latest-v[Y]:null;
  // YTD: last obs of previous calendar year
  const yr=dParts(DATES[L]).y; let yi=-1; for(let i=L;i>=0;i--){ if(dParts(DATES[i]).y<yr){ yi=i; break; } }
  let YB=-1; if(yi>=0){ for(let i=yi;i>=yi-4&&i>=0;i--) if(v[i]!=null){YB=i;break;} }
  r.ytd = YB>=0? pctCh(r.latest,v[YB],s):null; r.ytdAbs = YB>=0? r.latest-v[YB]:null;
  // 52w window stats
  let hi=-Infinity, lo=Infinity, rets=[], absch=[], miss=0;
  for(let i=Math.max(0,L-51); i<=L; i++){
    const x=v[i]; if(x==null){miss++; continue;}
    if(x>hi) hi=x; if(x<lo) lo=x;
    const y=v[i-1]; if(i>0 && y!=null){ absch.push(x-y); if(x>0&&y>0) rets.push(Math.log(x/y)); }
  }

  if(r.prev!=null && r.P===L-1){

    else { const sg=sd(za); r.z = sg? r.abs/sg : null; }
  } else r.z=null;

  const q=[]; if(r.stale>0) q.push({lvl:'warn',t:'Stale '+r.stale+'w'});
  if(fr>=3) q.push({lvl:'warn',t:'Flat '+fr+'w'});
  if(tgtCur(s)!==s.cur){ let rl=-1; for(let i=Math.min(t,s.fs-1);i>=0;i--) if(s.raw[i]!=null){ rl=i; break; } if(rl>L) q.push({lvl:'warn',t:'FX n/a'}); }
  if(miss>5) q.push({lvl:'warn',t:'Gaps '+miss+'/52'});
  if(s.zeros>0) q.push({lvl:'info',t:'Zero-coded '+s.zeros});
  r.stat=stAt(s,L); if(r.stat==='E') q.unshift({lvl:'est',t:'Estimated'}); else if(r.stat==='P') q.unshift({lvl:'info',t:'Published WB'}); else if(r.stat==='D') q.unshift({lvl:'info',t:'Derived WB×FX'});
  r.q=q; r.qLvl = q.some(x=>x.lvl==='warn')?'warn':r.stat==='E'?'est':q.length?'info':'ok';
  CACHE.set(key,r); return r;
}
function allStats(t=S.asOf){ return SERIES.filter(inScope).map(s=>stats(s,t)).filter(r=>r.L>=0); }
// historical context for a weekly move
function moveContext(s, r){
  if(r.wow==null && r.abs==null) return null;
  const useAbs = r.wow==null; const cur = useAbs? r.abs : r.wow; const L=r.L, v=s.v;
  let since=null; const all=[];
  for(let i=1;i<L;i++){ const a=v[i],b=v[i-1]; if(a==null||b==null) continue; const m = useAbs? a-b : (b>0? a/b-1 : null); if(m==null) continue; all.push(Math.abs(m)); }
  for(let i=L-1;i>=1;i--){ const a=v[i],b=v[i-1]; if(a==null||b==null) continue; const m = useAbs? a-b : (b>0? a/b-1:null); if(m==null) continue; if(cur>0? m>=cur : m<=cur){ since=DATES[i]; break; } }
  const pctile = all.length? all.filter(x=>x<Math.abs(cur)).length/all.length : null;
  return {since, pctile, n:all.length};
}
function corr(a,b){ const n=a.length; if(n<20) return null; const ma=mean(a), mb=mean(b); let sab=0,saa=0,sbb=0; for(let i=0;i<n;i++){ const x=a[i]-ma,y=b[i]-mb; sab+=x*y; saa+=x*x; sbb+=y*y; } return saa&&sbb? sab/Math.sqrt(saa*sbb):null; }
function returnsPair(s1,s2,L,w=156){ const a=[],b=[]; for(let i=Math.max(1,L-w+1);i<=L;i++){ const x1=s1.v[i],y1=s1.v[i-1],x2=s2.v[i],y2=s2.v[i-1]; if([x1,y1,x2,y2].some(x=>x==null)) continue; if(i>=s1.fs||i>=s2.fs) continue; a.push(x1-y1); b.push(x2-y2); } return [a,b]; }
// equal-weight chain index for a set of series (outright + index only)
function chainIndex(list, from, to){
  const out=[]; let idx=100; out.push(idx);
  for(let i=from+1;i<=to;i++){
    const rs=[]; list.forEach(s=>{ if(s.type==='Differential') return; const a=s.v[i],b=s.v[i-1]; if(a!=null&&b!=null&&b>0&&a>0) rs.push(a/b-1); });
    const m=mean(rs); idx = idx*(1+(m||0)); out.push(idx);
  }
  return out;
}

/* ============================ ALERTS ============================ */
function computeAlerts(){
  const A=[]; const st=allStats();
  st.forEach(r=>{
    if(r.z!=null && Math.abs(r.z)>=S.pcr.z && (r.s.type!=='Differential' || S.pcr.diff)) A.push({lvl:'crit',kind:'Move',s:r.s,msg:'Weekly move '+(r.wow!=null?fmtPct(r.wow):fmtAbs(r.abs)+' '+r.s.unit)+' = '+r.z.toFixed(1)+'σ vs trailing 52 weeks'});
    else if(r.wow!=null && Math.abs(r.wow)>=S.pcr.pct/100) A.push({lvl:'warn',kind:'Move',s:r.s,msg:'Weekly move '+fmtPct(r.wow)+' exceeds ±'+S.pcr.pct+'% threshold'});
    if(r.rangePos!=null && r.rangePos>=0.98 && r.s.type!=='Differential' && r.stale===0) A.push({lvl:'warn',kind:'52w high',s:r.s,msg:'At or near 52-week high ('+fmtP(r.hi)+' '+r.s.unit+')'});
  });
  const stale=st.filter(r=>r.stale>0);
  if(true){ const miss=fxNeeded().filter(c=>c!==S.cur && fxCoverage(c)<1 || (S.cur!=='EUR'&&fxCoverage(S.cur)<1)); if(miss.length) A.push({lvl:'warn',kind:'FX',msg:'FX rates do not cover every price week for '+[...new Set(miss.concat(S.cur!=='EUR'?[S.cur]:[]))].filter(c=>fxCoverage(c)<1).join(', ')+'. Weeks without a rate are left blank.',link:'imports'}); }
  if(FX.dates.length){ const due=fxDue(); if(due.overdue) A.push({lvl:'warn',kind:'FX',msg:'FX rates are due for their '+FX.meta.frequency+' update ('+due.label+'). Latest rate: '+fmtD(FX.dates[FX.dates.length-1])+'.',link:'imports'}); }
  if(stale.length) A.push({lvl:'info',kind:'Data',msg:stale.length+' series have no observation for '+wkLabel(DATES[S.asOf])+' (stale). Values shown are the latest available.',link:'weekly',ql:'warn'});
  return A;
}

function sparkSVG(s, L, n=26, w=78, h=20){
  const pts=[]; for(let i=Math.max(0,L-n+1);i<=L;i++) if(s.v[i]!=null) pts.push([i,s.v[i]]);
  if(pts.length<2) return '';
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const X=i=>2+(w-4)*(i-x0)/((x1-x0)||1), Y=y=>h-3-(h-6)*(y-y0)/((y1-y0)||1);
  const d=pts.map((p,k)=>(k?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const last=pts[pts.length-1], first=pts[0]; const c= last[1]>first[1]?'var(--up)':last[1]<first[1]?'var(--down)':'var(--flat)';
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.4" stroke-linejoin="round"/><circle cx="'+X(last[0]).toFixed(1)+'" cy="'+Y(last[1]).toFixed(1)+'" r="2" fill="'+c+'"/></svg>';
}

function subGroups(st){ const g={}; st.forEach(r=>{ (g[r.s.sub]=g[r.s.sub]||[]).push(r); }); return g; }
function commentary(st, t){
  const up=st.filter(r=>r.stale===0 && (r.wow!=null? r.wow>1e-9 : r.abs>1e-9)).length;
  const dn=st.filter(r=>r.stale===0 && (r.wow!=null? r.wow<-1e-9 : r.abs<-1e-9)).length;
  const cur=st.filter(r=>r.stale===0 && r.abs!=null).length; const fl=cur-up-dn;
  const med=median(st.filter(r=>r.stale===0).map(r=>r.wow));
  const g=subGroups(st.filter(r=>r.stale===0)); const parts=Object.keys(g).map(k=>({k, m:median(g[k].map(r=>r.wow)), n:g[k].length})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);
  const ranked=st.filter(r=>r.stale===0 && r.wow!=null && r.s.type!=='Differential').sort((a,b)=>b.wow-a.wow);
  const top=ranked[0], bot=ranked[ranked.length-1];
  let p='<p>In <b>'+wkLabel(DATES[t])+'</b> (week ending '+fmtD(DATES[t])+'), <b>'+up+'</b> of '+cur+' series with a current observation rose, <b>'+dn+'</b> fell and <b>'+fl+'</b> were unchanged. The median weekly change was <b>'+fmtPct(med)+'</b>.';
  if(parts.length) p+=' By subcategory, '+parts.map(x=>esc(subName(+x.k))+' moved '+fmtPct(x.m)+' (median, n='+x.n+')').join('; ')+'.';
  p+='</p>';
  const lk=r=>'<a href="#c-'+r.s.id+'">'+esc(r.s.name)+'</a> ('+fmtPct(r.wow)+(r.z!=null?', '+r.z.toFixed(1)+'σ':'')+')';
  if(top||bot) p+='<p>'+(top&&top.wow>0?'The largest rise was '+lk(top)+'. ':'No outright series rose. ')+(bot&&bot.wow<0?'The largest fall was '+lk(bot)+'.':'No outright series fell this week.')+'</p>';
  const flat=st.filter(r=>r.stale===0 && r.flatRun>=3).length;
  if(flat) p+='<p><b>Data caveat:</b> '+flat+' series have shown the same value for 3 or more weeks, which suggests carried-forward prices. Treat “unchanged” counts with caution. <a href="#weekly" data-flat="1">Review</a></p>';
  const ne=st.filter(r=>r.stale===0 && r.stat==='E').length;
  if(ne) p+='<p><b>Estimates:</b> '+ne+' of '+st.filter(r=>r.stale===0).length+' values this week are benchmark-linked estimates, not observed prices. <a href="#imports">Method</a></p>';
  p+='<p style="color:var(--mute);font-size:12px">Generated automatically from the data shown. No verified market drivers are connected for this week, so the text does not state causes.</p>';
  return p;
}
function vOverview(v){
  const t=S.asOf, st=allStats(t), cur=st.filter(r=>r.stale===0);
  const up=cur.filter(r=>(r.wow??r.abs)>1e-9).length, dn=cur.filter(r=>(r.wow??r.abs)<-1e-9).length, fl=cur.filter(r=>r.abs!=null).length-up-dn;
  const med=median(cur.map(r=>r.wow)), medY=median(cur.map(r=>r.yoy));

function wkFiltered(){
  const f=S.wk, q=f.q.trim().toLowerCase();
  return allStats().filter(r=>{ const s=r.s;
    if(f.wl && !S.wl.has(s.id)) return false;
    if(f.cur && s.cur!==f.cur) return false;
    if(f.type && s.type!==f.type) return false;
    if(f.ql && r.qLvl!==f.ql) return false;
    if(f.flat && !(r.flatRun>=3)) return false;
    if(q && !(s.name+' '+s.id+' '+ctryName(s.ctry)+' '+s.ctry+' '+s.desc).toLowerCase().includes(q)) return false;
    return true; });
}
function wkSorted(rows){
  const k=S.wk.sort, d=S.wk.dir;
  const val=r=>{ switch(k){ case 'name': return r.s.name.toLowerCase(); case 'sub': return subName(r.s.sub); case 'ctry': return ctryName(r.s.ctry); case 'type': return r.s.type; case 'unit': return r.s.unit; case 'date': return r.L; case 'ql': return r.qLvl; case 'src': return r.s.src; case 'latest': return r.latest*unitConv(r.s).f; case 'prev': return r.prev==null?null:r.prev*unitConv(r.s).f; case 'abs': return r.abs; default: return r[k]; } };
  return rows.slice().sort((a,b)=>{ const x=val(a),y=val(b); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (x<y?-1:x>y?1:0)*d || a.s.id.localeCompare(b.s.id); });
}

function implication(r){
  const up=(r.wow??0)>0; const hi=r.rangePos!=null&&r.rangePos>=0.8, lo=r.rangePos!=null&&r.rangePos<=0.2;
  if(up && hi) return 'Price is in the top fifth of its 52-week range after a large rise. Review open positions and cover timing. Check supplier quotes before committing new volume.';
  if(up) return 'Cost pressure is building, but the price is still below its 52-week high. Watch whether the move holds next week before changing the buying plan.';
  if(!up && lo) return 'Price is near its 52-week low after a large fall. This may be a window to extend cover, subject to quality and supply checks.';
  return 'Prices are easing. Consider deferring spot purchases if stock cover allows. Confirm against supplier offers.';
}

function validateDataset(list, isBase){
  const R=[]; const fc=list.filter(s=>s.fs<DATES.length);
  if(isBase && EST){ R.push({lvl:'info',msg:'The forecast columns W08–W11 2025 (multipliers in cells TP1:TT3) are replaced by the completed weekly data.'}); R.push({lvl:'info',msg:'Weeks '+wkLabel(DATES[OBS_END+1])+' to '+wkLabel(DATES[DATES.length-1])+' ('+(DATES.length-1-OBS_END)+' weeks) completed from public benchmarks. See Data methodology below.'}); }
  if(fc.length){ const f=fc[0]; R.push({lvl:'info',msg:'Forecast columns detected: '+DATES.slice(f.fs).map(wkLabel).join(', ')+' ('+fmtD(DATES[f.fs])+' → '+fmtD(DATES[DATES.length-1])+'). They are stored apart from observed history and excluded from all change calculations.'});
    const bad=fc.filter(s=>{ if(!s.fcFactors) return false; for(let k=0;k<s.fcFactors.length&&s.fs+k<DATES.length;k++){ const a=s.raw[s.fs+k-1], b=s.raw[s.fs+k]; if(a==null||b==null||Math.abs(b/a-s.fcFactors[k])>1e-7*Math.max(1,1/Math.abs(a))+1e-6) return true; } return false; });
    R.push({lvl:bad.length?'warn':'info',msg:(fc.length-bad.length)+' of '+fc.length+' series follow the factor block exactly (forecast = previous week × factor). '+(bad.length?'Exceptions: '+bad.map(s=>s.id).join(', ')+'. Their previous observation is missing or zero, so the chain breaks.':'')}); }
  const lastObsDate=DATES[OBS_END]; if(isBase) R.push({lvl:'warn',msg:'The file name references W10 2025. The last observed week in the file is '+wkLabel(lastObsDate)+' ('+fmtD(lastObsDate)+'). Please confirm the intended reporting week.'});
  const z=list.filter(s=>s.zeros>0); if(z.length) R.push({lvl:'warn',msg:z.length+' series contain zero values ('+z.reduce((a,s)=>a+s.zeros,0)+' cells), treated as missing. Worst: '+z.sort((a,b)=>b.zeros-a.zeros).slice(0,4).map(s=>s.id+' ('+s.zeros+')').join(', ')+'.'});
  const ng=list.filter(s=>s.neg>0); if(ng.length) R.push({lvl:'info',msg:ng.length+' differential series contain negative values. This is expected for differentials, so their % changes are not computed.'});
  const late={}; list.forEach(s=>{ const f=s.raw.findIndex(x=>x!=null); if(f>0){ (late[DATES[f]]=late[DATES[f]]||[]).push(s.id); } });
  Object.keys(late).sort().forEach(d=>R.push({lvl:'info',msg:late[d].length+' series start on '+fmtD(d)+' (shorter history): '+late[d].slice(0,6).join(', ')+(late[d].length>6?'…':'')}));
  const units=new Set(list.map(s=>s.unit)); R.push({lvl:'info',msg:'Units normalised (trailing spaces trimmed): '+[...units].join(', ')+'. Mixed currencies (EUR, USD) are not FX-converted.'});
  const unk=list.filter(s=>!CTRY[s.ctry]); R.push({lvl:unk.length?'crit':'ok',msg:unk.length?'Unknown country codes: '+unk.map(s=>s.ctry).join(', '):'All country codes resolve against the reference list ('+Object.keys(CTRY).length+' codes; includes regional codes such as WOR, EUU).'});
  const unS=list.filter(s=>!SUB[s.sub]); R.push({lvl:unS.length?'crit':'ok',msg:unS.length?'Unknown subcategory ids: '+[...new Set(unS.map(s=>s.sub))].join(', '):'All subcategory ids resolve against the taxonomy.'});
  R.push({lvl:'info',msg:'Category id '+[...new Set(list.map(s=>s.cat))].join(', ')+' mapped to “'+[...new Set(list.map(s=>catName(s.cat)))].join(', ')+'” by position in the taxonomy list. Please confirm the official category id table.'});
  return R;
}

function serialToISO(x){ if(x instanceof Date) return x.toISOString().slice(0,10); if(typeof x==='number'&&x>20000&&x<80000){ const d=new Date(Date.UTC(1899,11,30)+Math.round(x)*864e5); return d.toISOString().slice(0,10); } if(typeof x==='string'&&/^\d{4}-\d{2}-\d{2}/.test(x)) return x.slice(0,10); if(typeof x==='string'&&/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(x)){ const [d,m,y]=x.split('/').map(Number); return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); } return null; }

  }catch(e){ msg.innerHTML='<div class="note" style="border-color:var(--crit)"><b style="color:var(--crit)">Import failed.</b> '+esc(e.message)+'</div>'; } };
  rd.readAsArrayBuffer(f);

const UPL={ stage:null, list:[], loaded:false, busy:false, msg:'', applied:new Set() };
let WKIDX=null;
function wkKey(iso){ const k=isoWeek(iso); return k.y+'-'+k.w; }
function wkIndex(){ if(!WKIDX||WKIDX._n!==DATES.length){ WKIDX={_n:DATES.length}; DATES.forEach((d,i)=>{ WKIDX[wkKey(d)]=i; }); } return WKIDX; }
const UPL_DRV={brent:'Brent crude (World Bank)',ttf:'EU natural gas (World Bank)',maize:'Maize (World Bank)',soymeal:'Soybean meal (World Bank)',urea:'Urea (World Bank)'};
/* ---------- parsing ---------- */
function uplParse(aoa, fname){
  const hr=aoa.findIndex(r=>r&&r.some(c=>typeof c==='string'&&c.trim().toLowerCase()==='code_produit'));
  if(hr<0) throw new Error('Header row not found. The file needs a “code_produit” column.');
  const H=aoa[hr].map(c=>typeof c==='string'?c.trim().toLowerCase():c); const col=n=>H.indexOf(n);
  const cP=col('code_produit'), cN=col('nom_produit'), cU=col('unite_de_mesure'), cD=col('description'), cC=col('id_categorie'), cS=col('id_sous_categorie'), cK=col('code_pays');
  if([cN,cU,cS,cK].some(x=>x<0)) throw new Error('Missing required columns (Nom_produit, Unite_de_mesure, id_sous_categorie, code_pays).');
  const dcols=[]; for(let j=cK+1;j<H.length;j++){ const iso=serialToISO(aoa[hr][j]); if(iso) dcols.push([j,iso]); }
  if(!dcols.length) throw new Error('No weekly date columns found after code_pays.');
  let fsDate=null; for(let i=0;i<hr;i++){ const r=aoa[i]||[]; for(let j=cK+1;j<r.length;j++){ if(typeof r[j]==='string' && typeof r[j+1]==='number'){ const d=(dcols.find(x=>x[0]===j+1)||[])[1]; if(d && (!fsDate||d<fsDate)) fsDate=d; } } }
  const W=wkIndex(), rows=[], seen={}; let outside=0;
  for(let i=hr+1;i<aoa.length;i++){ const r=aoa[i]; if(!r||r[cP]==null||String(r[cP]).trim()==='') continue;
    const id=String(r[cP]).trim(); const unit=String(r[cU]||'').trim(); const [cur,per]=unit.includes('/')?unit.split('/'):[unit,''];
    const name=String(r[cN]||'').replace(/\s+/g,' ').trim().replace(/\s+(EUR|USD)\/\S+$/,'');
    const vals=new Array(DATES.length).fill(null); let zeros=0, neg=0, nonnum=0, n=0;
    dcols.forEach(([j,iso])=>{ if(fsDate && iso>=fsDate) return; let x=r[j]; if(typeof x==='string'&&x.trim()!==''){ const y=parseFloat(x.replace(/\s/g,'').replace(',','.')); if(isFinite(y)) x=y; else { nonnum++; x=null; } } if(typeof x!=='number'||!isFinite(x)) return; if(x===0){ zeros++; return; } if(x<0) neg++;
      const k=W[wkKey(iso)]; if(k==null){ outside++; return; } vals[k]=x; n++; });
    const sub=+r[cS]; const typ=/\bdiff?\b/i.test(name)?'Differential':/index/i.test(name)?'Index':'Outright';
    let first=-1,last=-1; vals.forEach((x,k)=>{ if(x!=null){ if(first<0) first=k; last=k; } });
    let jumps=0; for(let k=first+1;k<=last&&k>0;k++){ const a=vals[k], b=vals[k-1]; if(a!=null&&b!=null&&b>0&&Math.abs(a/b-1)>0.5) jumps++; }
    const exist=BYID[id]&&!BYID[id]._upl ? BYID[id] : null;
    rows.push({id,name,unit,cur:cur.trim(),per:per.trim(),desc:String(r[cD]||'').trim(),cat:+r[cC]||null,sub,ctry:String(r[cK]||'').trim(),type:typ,vals,first,last,n,zeros,neg,nonnum,jumps,dup:!!seen[id],exist:!!exist,action:exist?'merge':'add'});
    seen[id]=1; }
  if(!rows.length) throw new Error('No data rows found below the header.');
  return {file:fname, rows, dcols:dcols.length, fsDate, outside};
}
function uplValidate(st){
  const R=[], T=DATES.length-1; const catOf=sub=>{ const t=SUB[sub]; if(!t) return null; const e=Object.entries(CAT_ID).find(([k,v])=>v===t.cat); return e?+e[0]:null; };
  st.rows.forEach(r=>{ r.err=[]; r.warn=[];
    if(!SUB[r.sub]) r.err.push('Unknown subcategory '+r.sub); else { const c=catOf(r.sub); if(c && r.cat!==c){ r.warn.push('Category corrected to '+catName(c)); r.cat=c; } }
    if(!r.unit) r.err.push('No unit'); else if(!r.per) r.warn.push('Unit has no “/”'); if(!r.n) r.err.push('No numeric values');
    if(!CTRY[r.ctry]) r.warn.push('Unknown country code “'+r.ctry+'”');
    if(r.dup) r.err.push('Duplicate code in file'); if(r.jumps) r.warn.push(r.jumps+' weekly jumps >50%'); if(r.neg && r.type!=='Differential') r.warn.push(r.neg+' negative values');
    if(r.err.length) r.action='skip'; });
  const nE=st.rows.filter(r=>r.err.length).length, nW=st.rows.filter(r=>r.warn.length).length;

function bindUploads(v){

    catch(e){ toast('Only Admins can remove uploads'); b.disabled=false; } });

async function uplCommit(){
  const st=UPL.stage; if(!st||UPL.busy) return; UPL.busy=true; const btn=$('#uplGo'); if(btn){ btn.disabled=true; btn.textContent='Loading…'; }
  const keep=st.rows.filter(r=>r.action!=='skip'&&!r.err.length);
  const id='UPL-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
  const pack=keep.map(r=>{ const a=r.first, b=r.last; return {id:r.id,name:r.name,unit:r.unit,cur:r.cur,per:r.per,desc:r.desc.slice(0,300),cat:r.cat,sub:r.sub,ctry:r.ctry,type:r.type,action:r.action,w0:wkKey(DATES[a]),v:r.vals.slice(a,b+1).map(x=>x==null?null:+(+x).toPrecision(7))}; });
  const last=Math.max(...keep.map(r=>r.last));
  const meta={id,file:st.file,imported:new Date().toISOString(),by:ACC.uid||null,count:pack.length,lastWeek:wkLabel(DATES[last]),methods:st.methods,status:'active',report:st.report.map(x=>({lvl:x.lvl,msg:x.msg}))};
  try{
    if(UPL.db){ const chunks=[]; let cur=[], size=0; pack.forEach(p=>{ const z=JSON.stringify(p).length; if(size+z>170000&&cur.length){ chunks.push(cur); cur=[]; size=0; } cur.push(p); size+=z; }); if(cur.length) chunks.push(cur);
      for(let k=0;k<chunks.length;k++) await UPL.db.doc('upload_data/'+id+'-'+k).set({imp:id,k,series:chunks[k]});
      await UPL.db.doc('uploads/'+id).set(JSON.parse(JSON.stringify(meta))); auditLog('data.import',st.file,pack.length+' series · '+id); }
    const res=uplIntegrate(meta,pack); UPL.list.push(meta); UPL.stage=null; fillGlobal();
    toast('Loaded '+(res.added+res.merged)+' series · '+res.fc+' forecasts computed'); S.impSel=id;
  }catch(e){ toast(e&&e.code==='invalid_argument'?'Only Admins can load data into the shared workspace':'Upload failed ('+(e&&e.code||'error')+')'); }
  UPL.busy=false; render();
}

    if(db){ db.collection('roles').onSnapshot(snap=>{ const r={}; snap.docs.forEach(d=>{ r[d.id]=d.data()||{}; }); ACC.roles=r; accApply(); }, ()=>accApply()); }

function h2cFix(doc){ // html2canvas 1.4 cannot parse color()/color-mix(): resolve every colour to rgba in the clone
  const cv=document.createElement('canvas'); cv.width=cv.height=1; const g=cv.getContext('2d',{willReadFrequently:true}); const memo={};
  const rgb=v=>{ if(memo[v]) return memo[v]; g.clearRect(0,0,1,1); g.fillStyle='#000'; g.fillStyle=v; g.fillRect(0,0,1,1); const d=g.getImageData(0,0,1,1).data; return memo[v]='rgba('+d[0]+','+d[1]+','+d[2]+','+(d[3]/255).toFixed(3)+')'; };
  const P=['color','backgroundColor','borderTopColor','borderRightColor','borderBottomColor','borderLeftColor','outlineColor','textDecorationColor','fill','stroke'];
  doc.querySelectorAll('*').forEach(el=>{ const cs=doc.defaultView.getComputedStyle(el); P.forEach(k=>{ const v=cs[k]; if(v && /color\(|color-mix|oklab|oklch|lab\(|lch\(/.test(v)) el.style[k]=rgb(v); }); if(cs.boxShadow && cs.boxShadow!=='none') el.style.boxShadow='none'; if(/color\(|color-mix/.test(cs.backgroundImage||'')) el.style.backgroundImage='none'; });
}
async function dashPNG(el,name){ try{ await repLoadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','html2canvas'); const cv=await html2canvas(el,{scale:2,backgroundColor:css('--panel')||'#fff',logging:false,onclone:h2cFix}); cv.toBlob(b=>saveFile(name,b),'image/png'); }catch(e){ toast('Image export unavailable'); } }

function repCtx(){

  const nf=(v,dp)=>(+v).toLocaleString(loc,{minimumFractionDigits:dp,maximumFractionDigits:dp});
  const P=v=>{ if(v==null||!isFinite(v)) return '—'; const a=Math.abs(v); const dp=a>=100?0:a>=10?1:a>=1?2:3; return nf(v,dp); };
  const Pc=(x,dp=1)=>{ if(x==null||!isFinite(x)) return '—'; const v=x*100; return (v>0.00001?'+':v<-0.00001?'−':'')+nf(Math.abs(v),dp)+(fr?' %':'%'); };

  const MO=fr?['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.']:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function repStance(x,c){ // x: {d (P50 13w), w90, band}

  if(x.d>=0.03) return {k:'cover',t:c.L('Couvrir à terme','Cover forward'),c:'crit',why:c.L('médiane à 13 semaines ≥ +3 %','13-week median ≥ +3%')};
  if(x.w90!=null && x.w90>=0.15 && x.d>=0) return {k:'cover',t:c.L('Couvrir à terme','Cover forward'),c:'crit',why:c.L('risque haussier : P90 pondéré à '+c.Pc(x.w90),'upside risk: weighted P90 at '+c.Pc(x.w90))};

}

function repSig(sg,c){ const m={'Rising · consider forward cover':c.L('Hausse · envisager une couverture','Rising · consider forward cover'),'Upside bias · watch':c.L('Biais haussier · surveiller','Upside bias · watch'),'Falling · defer or buy to need':c.L('Baisse · différer','Falling · defer or buy to need'),'Downside bias · watch':c.L('Biais baissier · surveiller','Downside bias · watch'),'Stable · buy to plan':c.L('Stable · acheter selon le plan','Stable · buy to plan')}; return m[sg.t]||sg.t; }
function repFanSpec(fcr, scs, w, mm, c, back=104){
  const T=T_IDX(), H=26, hist=chainIndex(fcr.map(x=>x.s),T-back,T), b0=hist[hist.length-1];
  const xs=DATES.slice(T-back,T+1).map(d=>c.D(d)).concat(Array.from({length:H},(_,i)=>c.D(futDate(i+1))));
  const pad=()=>{ const a=new Array(back+1).fill(null); a[back]=100; return a; };
  const L={p50:pad(),p10:pad(),p90:pad(),w50:pad()}; const gm=a=>+(100*Math.exp(a.reduce((x,y)=>x+y,0)/a.length)).toFixed(2);
  for(let k=1;k<=H;k++){ const at=fcr.map(x=>x.F.at(k)); L.p50.push(gm(at.map((a,i)=>Math.log(a.p50/fcr[i].F.l0)))); L.p10.push(gm(at.map((a,i)=>Math.log(a.p10/fcr[i].F.l0)))); L.p90.push(gm(at.map((a,i)=>Math.log(a.p90/fcr[i].F.l0))));
    if(scs.length && (k%2===0 || k===H)){ L.w50.push(macGroup(fcr,k,scs,w,'base').w50); } else L.w50.push(null); }
  for(let i=back+1;i<L.w50.length;i++) if(L.w50[i]==null){ let j=i+1; while(j<L.w50.length&&L.w50[j]==null) j++; L.w50[i]= j<L.w50.length? +((L.w50[i-1]+(L.w50[j]-L.w50[i-1])/(j-i+1))).toFixed(2) : L.w50[i-1]; }
  return {kind:'fan', xs, back, hist:hist.map(y=>+(y/b0*100).toFixed(2)).concat(new Array(H).fill(null)), p50:L.p50, p10:L.p10, p90:L.p90, w50:scs.length?L.w50:null,
    names:{h:c.L('Historique','History'), p50:c.L('Médiane statistique','Statistical median'), w50:c.L('Médiane pondérée (scénarios)','Scenario-weighted median'), band:c.L('Fourchette 80 %','80% range')}};
}

function macWeights(scs){ const t=scs.reduce((a,s)=>a+Math.max(0,+s.p||0),0); return scs.map(s=>t>0? Math.max(0,+s.p||0)/t : (s.id==='base'?1:0)); }
function macRamp(k,lag,r){ return k<=lag?0:Math.min(1,(k-lag)/Math.max(1,r)); }
function macShock(s,sc,k){
  const E=macSens()[String(s.sub)], parts={}; let tot=0; const sh=sc.shock||{};
  if(E){ ['brent','ttf','feed','urea'].forEach(d=>{ const x=+sh[d]; if(!x) return; const f=MAC.factors[d]; const v=(+E[d]||0)*Math.log(1+x/100)*macRamp(k,f.lag,f.ramp); if(v){ parts[d]=v; tot+=v; } }); }
  const x=+sh.eurusd;
  if(x){ const f=MAC.factors.eurusd, L=Math.log(1+x/100)*macRamp(k,f.lag,f.ramp), u=E?(+E.usd):0.5; let v=0;
    if(s.cur==='EUR') v=-u*L; else if(s.cur==='USD') v=(1-u)*L;
    const tc=tgtCur(s); if(tc!==s.cur){ if(s.cur==='EUR'&&tc==='USD') v+=L; else if(s.cur==='USD'&&tc==='EUR') v-=L; }
    if(v){ parts.eurusd=v; tot+=v; } }
  (sc.direct||[]).forEach(d=>{ if(+d.sub!==+s.sub) return; if(d.ctry && d.ctry!==s.ctry) return; const v=Math.log(1+(+d.pct||0)/100)*macRamp(k,+d.lag||0,+d.ramp||1); if(v){ parts.direct=(parts.direct||0)+v; tot+=v; } });

const MQP=[0.001,0.025,0.10,0.50,0.90,0.975,0.999];
function macKnots(a,sh){ const q=[a.p025,a.p10,a.p50,a.p90,a.p975].map(v=>Math.log(v)+sh); return [q[0]-1.2*(q[1]-q[0]),q[0],q[1],q[2],q[3],q[4],q[4]+1.2*(q[4]-q[3])]; }
function macCdf(K,y){ if(y<=K[0]) return 0; if(y>=K[6]) return 1; for(let i=1;i<7;i++) if(y<=K[i]) return MQP[i-1]+(MQP[i]-MQP[i-1])*(y-K[i-1])/((K[i]-K[i-1])||1e-9); return 1; }
function macMixQ(comp,p){ let lo=Infinity,hi=-Infinity; comp.forEach(c=>{ if(c.w>0){ lo=Math.min(lo,c.K[0]); hi=Math.max(hi,c.K[6]); } });
  for(let it=0;it<30;it++){ const m=(lo+hi)/2; const F=comp.reduce((a,c)=>a+c.w*macCdf(c.K,m),0); if(F<p) lo=m; else hi=m; } return Math.exp((lo+hi)/2); }
function macEval(s,F,k,scs,w){
  const a=F.at(k); const out={a, sc:{}, comp:[]}; let ex=0;
  scs.forEach((sc,j)=>{ const r=macShock(s,sc,k); out.sc[sc.id]={sh:r.tot, parts:r.parts, p50:a.p50*Math.exp(r.tot)}; ex+=w[j]*a.exp*Math.exp(r.tot); out.comp.push({w:w[j],K:macKnots(a,r.tot)}); });
  out.exp=ex; const memo={}; out.wq=p=>(memo[p]!==undefined?memo[p]:(memo[p]=macMixQ(out.comp,p))); return out;

function macGroup(sel,k,scs,w,selId){ // group-level mixture on equal-weight averages of log quantiles and scenario shifts
  const n=sel.length; if(!n) return null; const Q=[0,0,0,0,0]; const SH=scs.map(()=>0);
  sel.forEach(x=>{ const a=x.F.at(k), l0=x.F.l0; [a.p025,a.p10,a.p50,a.p90,a.p975].forEach((v,i)=>{ Q[i]+=Math.log(v/l0)/n; }); scs.forEach((sc,j)=>{ SH[j]+=macShock(x.s,sc,k).tot/n; }); });
  const K=sh=>{ const q=Q.map(v=>v+sh); return [q[0]-1.2*(q[1]-q[0]),q[0],q[1],q[2],q[3],q[4],q[4]+1.2*(q[4]-q[3])]; };

function xbPrompt(X){
  const r1=x=>x==null?null:Math.round(x*1000)/10;
  const D={scope:X.label, week:X.week, display_currency:X.cur, series:X.n,
    moving:{median_weekly_pct:r1(X.moving.wow), median_13w_pct:r1(X.moving.c13), median_yoy_pct:r1(X.moving.yoy), volatility_pct:r1(X.moving.vol), advancers:X.moving.up, decliners:X.moving.dn, significant_moves:X.moving.sig, estimated_share_pct:r1(X.moving.est),
      top_up:X.moving.top.map(r=>({name:r.s.name, sub:subName(r.s.sub), wow_pct:r1(r.wow)})), top_down:X.moving.bot.map(r=>({name:r.s.name, sub:subName(r.s.sub), wow_pct:r1(r.wow)}))},
    why:{observed_13w_pct:X.why.obs!=null?r1(Math.exp(X.why.obs)-1):null, contributions_pct:Object.fromEntries(Object.entries(X.why.parts).map(([k,v])=>[k, v==null?null:r1(Math.exp(v)-1)])), container_freight_13w_pct:r1(X.why.sea), road_freight_13w_pct:r1(X.why.road), context:X.why.context.map(c=>c.kind+': '+c.t)},
    next:{p50_13w_pct:r1(X.next.d), p10_pct:r1(X.next.d10), p90_pct:r1(X.next.d90), scenario_weighted_p50_pct:r1(X.sc.kind==='series'?X.next.sw50:X.next.w50), scenario_weighted_p90_pct:r1(X.sc.kind==='series'?X.next.sw90:X.next.w90), series_with_p90_over_15pct:X.next.upTail, forecast_run:X.next.run, supply_or_weather_scenarios:(X.next.supply||[]).map(x=>x.name+' (probability '+Math.round(x.p*100)+'%)')},
    impact:{annual_spend:X.impact.spend||null, unhedged_cost_13w_p50:X.impact.spend?Math.round(X.impact.i50):null, unhedged_cost_13w_p90:X.impact.spend?Math.round(X.impact.i90):null, per_1m_spend_13w_p50:X.impact.per1m!=null?Math.round(X.impact.per1m):null, revenue:X.impact.rev||null,
      by_subcategory:X.impact.expo.slice(0,12).map(e=>({sub:subName(e.k), series:e.n, p50_13w_pct:r1(e.d), weighted_p90_pct:r1(e.w90), spend:e.spend||null, rule_stance:e.st.t}))},
    rule_actions:X.act.rules.map(a=>a.t+': '+a.why)};
  return 'You are a senior commodity and procurement analyst writing for executives of an industrial manufacturer. Using ONLY the JSON data below (do not invent prices, events, sources or numbers that are not in it), answer the five questions: what is moving, why, what happens next, the business impact, and what to do. Percentages in the data are already in percent. Contributions in "why" are log-approximate shares of the 13-week change: energy, feed, fert (fertiliser), usdprice (effect of the EUR/USD rate on USD-priced trade), fx (conversion into the display currency) and resid (commodity-specific supply and demand not explained by the tracked drivers). Forecasts are statistical model outputs, not market consensus; say so if you rely on them. Be concrete and brief. Never refer to yourself or the text as AI, IA, artificial intelligence, a language model or Claude.\n\nReply with only a JSON object of this shape: {"headline": string (one sentence, max 25 words), "insights": [{"q": "moving"|"why"|"next"|"impact", "text": string (max 30 words)}] (3 to 4 items), "actions": [{"action": string (imperative, max 12 words), "rationale": string (max 25 words, cite the figures), "horizon": "this week"|"next 4 weeks"|"next quarter", "confidence": "high"|"medium"|"low"}] (2 to 4 items), "caveat": string (max 25 words)}.\n\nDATA:\n'+JSON.stringify(D);
}
async function xbAiRun(X,refresh){
  const sample=await claude.use('sample').catch(()=>null);
  if(!sample){ XB.ai[X.key]={err:'Insights Report is not available in this view. The rule-based actions above still apply.'}; xbRefresh(); return; }
  const ctl=new AbortController(); XB.busy[X.key]=ctl; XB.ai[X.key]=null; xbRefresh();
  try{ const v=await sample.json(xbPrompt(X),{signal:ctl.signal, cache:refresh?{gcTime:6*3600e3, refresh:true}:{gcTime:6*3600e3}}); XB.ai[X.key]={v}; }
  catch(e){ const m={not_granted:'Insights Report was not allowed for this page. The rule-based actions above still apply.', sampling_disabled:'Insights Report is not available for this account.', rate_limited:'Too many Insights Report requests just now; try again in a few minutes.', invalid_json:'The Insights Report could not be read; try again.', cancelled:null, refused:'The Insights Report service declined this request.'};
    const t=e&&e.code in m? m[e.code] : 'Insights Report failed ('+(e&&e.code||'error')+'); try again.'; XB.ai[X.key]= t? {err:t} : null; }
  finally{ delete XB.busy[X.key]; xbRefresh(); }
}
function xbBind(p,X){
  p.querySelector('#xbTog').onclick=()=>{ XB.open=!XB.open; store.set('xbOpen',XB.open); p.classList.toggle('closed',!XB.open); const b=p.querySelector('#xbTog'); b.textContent=XB.open?'Collapse':'Expand'; b.setAttribute('aria-expanded',XB.open); };
  const rv=p.querySelector('#xbRev'); if(rv) rv.onchange=()=>{ const n=+String(rv.value).replace(/[^0-9.]/g,''); XB.rev=n>0?n:null; store.set('xbRev',XB.rev||0); xbRefresh(); };
  const ab=p.querySelector('#xbAiBtn'); if(ab) ab.onclick=()=>{ const had=!!(XB.ai[X.key]&&XB.ai[X.key].v); xbAiRun(X,had); };
  /* viewers and customers: the Insights Report runs on its own, no button press needed */
  XB.tried=XB.tried||{}; if(ACC.ready && !allow('report.issue') && window.claude && !XB.ai[X.key] && !XB.busy[X.key] && !XB.tried[X.key]){ XB.tried[X.key]=1; setTimeout(()=>{ if(!XB.ai[X.key]&&!XB.busy[X.key]) xbAiRun(X,false); },600); }
  const sb=p.querySelector('#xbAiStop'); if(sb) sb.onclick=()=>{ const c=XB.busy[X.key]; if(c) c.abort(); };
}
function xbRefresh(){
  const p=document.getElementById('xbPanel'), sc=xbScope(); if(!p||!sc||!p.isConnected) return;
  let X; try{ X=xbCompute(sc); }catch(e){ console.warn('brief',e); return; }
  try{ p.outerHTML=xbHTML(X); }catch(e){ return; } const q=document.getElementById('xbPanel'); if(q) xbBind(q,X);
}
function xbInject(v){
  const sc=xbScope(); if(!sc) return; const ph=v.querySelector('.ph-head'); if(!ph) return;
  let X; try{ X=xbCompute(sc); }catch(e){ console.warn('brief',e); return; }
  ph.insertAdjacentHTML('afterend', xbHTML(X));
  const p=v.querySelector('#xbPanel'); if(p) xbBind(p,X);
}

const INFO_KEYS = Object.keys(INFO).sort((a,b)=>b.length-a.length);
function infoKey(txt){ const t=txt.replace(/\s+/g,' ').trim(); return INFO_KEYS.find(k=>t.toLowerCase().startsWith(k.toLowerCase())) || null; }
function decorateInfo(root){
  root.querySelectorAll('.kpi .k, .p-head h2, .p-body h3, .ph-head h1').forEach(el=>{
    if(el.querySelector('.ib')) return;
    if(el.closest('.ph-head') && el.tagName==='H1' && S.route.startsWith('c-')) return;
    const k=infoKey(el.textContent); if(!k) return;
    const b=document.createElement('button'); b.type='button'; b.className='ib'; b.textContent='i'; b.dataset.ik=k; b.setAttribute('aria-label','About '+INFO[k][0]); b.setAttribute('aria-expanded','false');
    el.appendChild(b);
  });
}
const tipEl=document.createElement('div'); tipEl.className='tip'; tipEl.id='infotip'; tipEl.setAttribute('role','tooltip'); tipEl.hidden=true; document.body.appendChild(tipEl);
let tipFor=null, tipPinned=false;
function showTip(btn){
  const d=INFO[btn.dataset.ik]; if(!d) return;
  tipEl.innerHTML='<b>'+esc(d[0])+'</b><p>'+d[1]+'</p>'; tipEl.hidden=false; tipFor=btn;
  document.querySelectorAll('.ib[aria-expanded="true"]').forEach(x=>x.setAttribute('aria-expanded','false')); btn.setAttribute('aria-expanded','true'); btn.setAttribute('aria-describedby','infotip');
  const r=btn.getBoundingClientRect(), w=Math.min(320, window.innerWidth-24); tipEl.style.maxWidth=w+'px';
  const th=tipEl.offsetHeight, tw=tipEl.offsetWidth;
  let left=Math.min(Math.max(12, r.left+r.width/2-tw/2), window.innerWidth-tw-12);
  let top=r.bottom+8; if(top+th>window.innerHeight-12) top=Math.max(12, r.top-th-8);
  tipEl.style.left=left+'px'; tipEl.style.top=top+'px';
}
function hideTip(){ tipEl.hidden=true; if(tipFor){ tipFor.setAttribute('aria-expanded','false'); tipFor.removeAttribute('aria-describedby'); } tipFor=null; tipPinned=false; }
document.addEventListener('mouseover',e=>{ const b=e.target.closest&&e.target.closest('.ib'); if(b && !tipPinned) showTip(b); });
document.addEventListener('mouseout',e=>{ const b=e.target.closest&&e.target.closest('.ib'); if(b && !tipPinned && !(e.relatedTarget&&b.contains(e.relatedTarget))) hideTip(); });
document.addEventListener('focusin',e=>{ const b=e.target.closest&&e.target.closest('.ib'); if(b) showTip(b); });
document.addEventListener('focusout',e=>{ const b=e.target.closest&&e.target.closest('.ib'); if(b && !tipPinned) hideTip(); });
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('.ib'); if(b){ e.preventDefault(); e.stopPropagation(); if(tipPinned && tipFor===b){ hideTip(); } else { showTip(b); tipPinned=true; } return; } if(tipPinned && !e.target.closest('#infotip')) hideTip(); }, true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !tipEl.hidden) hideTip(); });
window.addEventListener('scroll',()=>{ if(!tipEl.hidden) hideTip(); }, {passive:true});
new MutationObserver(()=>{ clearTimeout(decorateInfo._t); decorateInfo._t=setTimeout(()=>decorateInfo($('#view')),30); }).observe($('#view'),{childList:true,subtree:true});

/* ============================ GLOBAL SEARCH & CONTROLS ============================ */
const gs=$('#gsearch'), gsug=$('#gsugg'); let gsHi=0, gsRes=[];
function gsRender(){ const q=gs.value.trim().toLowerCase(); if(!q){ gsug.hidden=true; return; }
  gsRes=SERIES.filter(s=>(s.name+' '+s.id+' '+ctryName(s.ctry)+' '+subName(s.sub)).toLowerCase().includes(q)).slice(0,12);
  gsug.innerHTML=gsRes.length? gsRes.map((s,i)=>'<button data-id="'+s.id+'" class="'+(i===gsHi?'hi':'')+'"><span>'+esc(s.name)+'</span><small>'+esc(ctryName(s.ctry))+' · '+s.id+'</small></button>').join('') : '<div class="empty" style="padding:14px">No matches</div>';
  gsug.hidden=false; gsug.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{ e.preventDefault(); gsPick(b.dataset.id); });
}
function gsPick(id){ gs.value=''; gsug.hidden=true; gs.blur(); go('c-'+id); }
gs.addEventListener('input',()=>{ gsHi=0; gsRender(); });
gs.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){ gsHi=Math.min(gsHi+1,gsRes.length-1); gsRender(); e.preventDefault(); } else if(e.key==='ArrowUp'){ gsHi=Math.max(0,gsHi-1); gsRender(); e.preventDefault(); } else if(e.key==='Enter'&&gsRes[gsHi]) gsPick(gsRes[gsHi].id); else if(e.key==='Escape'){ gsug.hidden=true; gs.blur(); } });
gs.addEventListener('blur',()=>setTimeout(()=>gsug.hidden=true,120));
document.addEventListener('keydown',e=>{ if(e.key==='/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); gs.focus(); } });
$('#asof').onchange=e=>{ S.asOf=+e.target.value; render(); };
['cat','sub','ctry','unit'].forEach(k=>$('#g-'+k).onchange=e=>{ S.g[k]=e.target.value; if(k==='cat'){ S.g.sub=''; S.g.ctry=''; S.g.unit=''; } if(k==='sub'){ S.g.ctry=''; S.g.unit=''; } store.set('g',S.g); CACHE.clear(); S.wk.page=0; render(); });
$('#g-cur').onchange=e=>{ S.cur=e.target.value; store.set('cur2',S.cur); setMode(); render(); };
$('#g-dunit').onchange=e=>{ S.dunit=e.target.value; store.set('dunit',S.dunit); setMode(); render(); };
$('#g-clear').onclick=()=>{ S.g={cat:'',sub:'',ctry:'',unit:''}; S.cur='USD'; S.dunit='native'; store.set('g',S.g); store.set('cur2','USD'); store.set('dunit','native'); setMode(); render(); };
$('#bell').onclick=()=>go('alerts');
$('#menuBtn').onclick=()=>$('#rail').classList.toggle('open');
$('#nav').addEventListener('click',e=>{ const a=e.target.closest('a[data-r]'); if(a && a.dataset.r==='weekly'){ S.wk.wl=false; } });

S.route=(location.hash||'#overview').slice(1)||'overview';
rebuildFX(); render(); initFXStore(); initAccess(); initMacroStore(); initReportStore(); initDashStore(); initUploads();
})();
